services:
  ieee-conference:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "8000"

    environment:
      API_TOKEN: "${API_TOKEN:?Define API_TOKEN on env}"
      HOME: /tmp
      TMPDIR: /tmp
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    stop_grace_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
